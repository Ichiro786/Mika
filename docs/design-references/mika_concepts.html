<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mika · Android concept studies</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#ddd9d6;color:#1c1b1a;font-family:'Inter Display','Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}body{width:1920px}
.board{position:relative;width:1920px;height:1090px;overflow:hidden;--bg:#FAF9F7;--ink:#222322;--muted:#82807c;--surface:#F0EFEC;--raised:#fff;--hair:#E9E6E2;--coral:#DB816A;--coralsoft:#F9D5CA;--status:#428565;--sep:#ebe7e1;--shadow:0 7px 22px rgba(42,36,31,.06);background:#EEEAE8;}
.board::before{content:"";position:absolute;width:900px;height:900px;border-radius:50%;left:-310px;top:440px;background:radial-gradient(circle,rgba(246,235,225,.95) 0%,transparent 70%);pointer-events:none;}
.board.dark{--bg:#08090A;--ink:#F2F0EC;--muted:#92918F;--surface:#18191B;--raised:#202123;--hair:#2A2B2D;--coral:#DC8066;--coralsoft:#54372F;--status:#8ED7A7;--sep:#2A2B2D;--shadow:0 6px 18px rgba(0,0,0,.18);background:#171819;color:#f4f0eb}
.board.dark::before{background:radial-gradient(circle,rgba(76,50,46,.22) 0%,transparent 70%)}
.board-header{position:absolute;top:53px;left:126px;right:126px;display:flex;justify-content:space-between;align-items:flex-start}

.board-title{font-size:47px;font-weight:600;line-height:1.1;letter-spacing:-2px;margin:0}.board-sub{font-size:17px;line-height:1.5;color:#77716D;margin:14px 0 0}.dark .board-sub{color:#aaa4a1}
.header-right{text-align:right;font-size:13px;letter-spacing:2px;font-weight:650;line-height:2;color:#847F7B;padding-top:11px}.dark .header-right{color:#9F9995}
.stage{position:absolute;inset:189px 130px 70px;display:flex;align-items:flex-start;justify-content:space-around;}
.phone-cell{width:365px;display:flex;align-items:center;flex-direction:column;gap:18px}
.phone{width:365px;height:794px;border:8px solid #212120;border-radius:52px;background:var(--bg);box-shadow:0 22px 58px rgba(39,34,31,.20), 0 0 0 2px rgba(0,0,0,.18),inset 0 0 0 1px #222;position:relative;overflow:hidden;color:var(--ink)}.dark .phone{border-color:#343436;box-shadow:0 22px 65px rgba(0,0,0,.48),0 0 0 2px rgba(255,255,255,.08)}
.phone::after{content:"";position:absolute;inset:0;border-radius:43px;border:1px solid rgba(255,255,255,.17);pointer-events:none}
.screen{width:100%;height:100%;position:relative;background:var(--bg);overflow:hidden;border-radius:43px}
.status{height:42px;padding:13px 26px 0;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;letter-spacing:-.4px}
.status-right{display:flex;align-items:center;gap:5px;color:var(--ink)}.signal{display:flex;height:12px;align-items:flex-end;gap:2px}.signal i{width:3px;background:currentColor;border-radius:1px}.signal i:nth-child(1){height:5px}.signal i:nth-child(2){height:7px}.signal i:nth-child(3){height:9px}.signal i:nth-child(4){height:12px}.wifi{font-size:12px;line-height:1}.battery{width:19px;height:10px;border:1.8px solid currentColor;border-radius:3px;padding:2px;position:relative}.battery:after{content:"";position:absolute;width:2px;height:4px;background:currentColor;right:-4px;top:1px;border-radius:1px}.battery b{display:block;background:currentColor;height:100%;width:95%;border-radius:1px}
.appbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 19px;position:relative}.circle-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--bg);border:1px solid var(--hair);color:var(--ink)}.brand{position:absolute;left:50%;transform:translateX(-50%);top:7px;width:50px;height:50px;background:var(--raised);box-shadow:0 3px 10px rgba(0,0,0,.025);border:1px solid var(--hair);border-radius:50%;display:grid;place-items:center}.brand svg{width:30px;height:30px}.avatar{font-size:13px;font-weight:650;background:var(--raised)}.head-group{display:flex;align-items:center;gap:10px}.head-group .brand{position:static;transform:none;width:35px;height:35px;box-shadow:none}.head-group .brand svg{width:22px;height:22px}
.page-inner{padding:0 21px}.hero{padding-top:48px}.hero h1{font-size:30px;letter-spacing:-1.3px;line-height:1.16;font-weight:650;margin:0}.hero h1 .serif{font-family:Georgia,serif;font-weight:400;font-style:italic;letter-spacing:-1.2px}.hero p{color:var(--muted);font-size:15px;margin:11px 0 0;line-height:1.45}
.section-label{display:flex;align-items:center;justify-content:space-between;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:650;font-size:10px;margin:42px 0 13px}.section-label .right-link{text-transform:none;letter-spacing:0;color:var(--ink);font-size:11px;font-weight:550}
.brief-card{background:var(--raised);border:1px solid var(--hair);border-radius:21px;padding:17px 16px 13px;box-shadow:var(--shadow)}
.brief-meta{font-size:11px;font-weight:600;display:flex;align-items:center;gap:7px;color:var(--muted)}.dot{width:6px;height:6px;background:var(--status);border-radius:50%;display:inline-block}.brief-meta .ready{color:var(--status)}
.brief-title{font-family:Georgia,serif;font-weight:500;font-size:21px;line-height:1.22;letter-spacing:-.5px;margin:15px 0 13px}.mini-stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--hair);padding-top:12px;gap:12px}.mini-stat small{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}.mini-stat strong{font-size:12px;font-weight:650}
.chat-note{display:flex;gap:10px;margin-top:21px;align-items:flex-start}.note-avatar{flex-shrink:0;border-radius:50%;width:23px;height:23px;background:var(--raised);border:1px solid var(--hair);display:grid;place-items:center}.note-avatar .small-logo{width:14px;height:14px}.chat-bubble{font-size:13px;line-height:1.48;max-width:272px;padding:12px 14px;background:var(--surface);border-radius:6px 16px 16px 16px}.note-actions{display:flex;gap:8px;margin:11px 0 0 33px}.chip{border:1px solid var(--hair);background:var(--raised);border-radius:20px;padding:7px 12px;font-size:11px;font-weight:600}.chip.accent{background:var(--coralsoft);border-color:transparent;color:var(--ink)}
.bottom-area{position:absolute;bottom:0;left:0;width:100%;padding:0 15px 16px;background:linear-gradient(to top,var(--bg) 85%,transparent)}.composer{min-height:48px;border:1px solid var(--hair);border-radius:28px;background:var(--raised);padding:6px 7px 6px 13px;display:flex;align-items:center;gap:11px;color:var(--muted);box-shadow:0 2px 7px rgba(0,0,0,.02)}.composer .placeholder{font-size:12px;flex:1;white-space:nowrap}.composer .iconwrap{color:var(--ink);display:grid;place-items:center}.composer .voice{display:grid;place-items:center;border-radius:50%;width:35px;height:35px;background:var(--ink);color:var(--bg)}
.nav{height:52px;display:flex;justify-content:space-around;align-items:center;border-radius:29px;border:1px solid var(--hair);background:var(--raised);margin:9px 12px 0;box-shadow:var(--shadow);padding:4px}.nav-item{height:42px;flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;font-size:10px;line-height:1;color:var(--muted)}.nav-item.active{background:var(--surface);border-radius:24px;color:var(--ink);font-weight:650}.nav-item svg{width:18px;height:18px}
.gesture{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:91px;height:3px;background:var(--ink);border-radius:8px;opacity:.52}
.tasks-title{font-size:30px;font-weight:650;letter-spacing:-1.2px;margin:23px 0 6px}.tasks-sub{font-size:13px;color:var(--muted)}.tabs{display:flex;gap:22px;margin-top:29px;padding-bottom:12px;border-bottom:1px solid var(--hair);color:var(--muted);font-size:15px}.tab.active{font-weight:650;color:var(--ink);position:relative}.tab.active:after{content:"";position:absolute;bottom:-13px;left:0;width:100%;height:2px;background:var(--ink);border-radius:3px}.tabs-right{margin-left:auto;color:var(--muted)}
.task-group{margin-top:28px}.task-label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:9px}.task-item{display:flex;gap:12px;min-height:60px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--hair)}.task-checkbox{flex:0 0 17px;width:17px;height:17px;border-radius:6px;border:1.4px solid var(--hair);margin-top:2px}.task-copy{flex:1;min-width:0}.task-copy strong{display:block;font-size:13px;font-weight:630;line-height:1.4}.task-copy p{font-size:11px;line-height:1.4;margin:4px 0;color:var(--muted)}.task-copy p .green{color:var(--status)}.task-copy p .warm{color:#BD8760}.dark .warm{color:#DFA680}.tiny-chevron{color:var(--muted);margin-top:3px}.progress{margin:8px 0 0;height:3px;border-radius:3px;background:var(--surface);width:100%}.progress:before{content:"";display:block;height:100%;width:56%;background:var(--coral);border-radius:3px}.task-group.working{margin-top:23px}.task-group.scheduled{margin-top:23px}.task-group.resolved{margin-top:23px}.task-group.resolved .task-label{display:flex;justify-content:space-between}
.fab{position:absolute;bottom:88px;right:22px;width:48px;height:48px;border-radius:19px;background:#D16C4E;display:grid;place-items:center;box-shadow:0 8px 18px rgba(188,87,61,.24);color:white}
.task-bottom{position:absolute;bottom:17px;left:15px;width:calc(100% - 30px)}.task-bottom .nav{margin:0 12px}.task-bottom .gesture{bottom:-13px}
.focus-header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 17px}.focus-pill{border:1px solid var(--hair);border-radius:22px;display:flex;align-items:center;gap:8px;padding:6px 13px;background:var(--raised)}.focus-pill b{font-size:11px;display:block}.focus-pill small{font-size:10px;display:block;color:#BF8967;margin-top:2px}.focus-chat{padding:27px 16px 0}.bubble-row{display:flex;margin:0 0 12px}.bubble-row.user{justify-content:flex-end}.bubble{max-width:250px;padding:12px 14px;border-radius:16px;font-size:13px;line-height:1.44;background:var(--surface)}.bubble-row.user .bubble{background:var(--coralsoft);border-radius:16px 16px 5px 16px}.bubble-row.assistant .bubble{border-radius:6px 16px 16px 16px}
.review-card{background:var(--raised);border:1px solid var(--hair);border-radius:23px;margin-top:13px;box-shadow:var(--shadow);overflow:hidden}.review-head{display:flex;align-items:center;gap:10px;padding:13px 14px 12px;border-bottom:1px solid var(--hair)}.review-icon{width:28px;height:28px;border-radius:10px;border:1px solid var(--hair);display:grid;place-items:center}.review-head b{font-size:13px;flex:1}.review-head span{font-size:10px;color:var(--status);font-weight:550}.review-body{padding:11px 14px 4px}.review-data{font-size:11px;color:var(--muted);padding:8px 0;border-bottom:1px solid var(--hair)}.review-data strong{font-size:11px;color:var(--ink);font-weight:550}.review-message{font-size:12px;line-height:1.6;white-space:pre-line;margin:12px 0}.file-chip{padding:8px 10px;border-radius:12px;border:1px solid var(--hair);display:flex;align-items:center;gap:7px;font-size:11px;margin:8px 0 0}.file-chip b{font-weight:550;flex:1}.file-chip small{color:var(--muted)}.review-actions{display:flex;gap:7px;padding:13px}.review-button{height:34px;flex:1;border-radius:18px;border:1px solid var(--hair);display:grid;place-items:center;font-size:12px;font-weight:650}.review-button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}.activity-strip{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:11px;margin:13px 6px}.activity-strip b{font-weight:600;color:var(--ink)}
.screen-label{font-size:14px;letter-spacing:.1px;font-weight:650;color:#5D5754}.dark .screen-label{color:#BDB4AF}.screen-label small{font-size:12px;font-weight:400;color:#99918D;margin-left:6px}
.footer{position:absolute;right:128px;bottom:38px;font-size:12px;color:#9B948F;letter-spacing:.8px}.dark .footer{color:#7C7877}
</style></head><body><div id="root"></div>
<script>
const paths={menu:'<path d="M4 7h16M4 12h12M4 17h8"/>',plus:'<path d="M12 4v16M4 12h16"/>',message:'<path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l1.6-3.2A7.5 7.5 0 1 1 20 11.5Z"/>',tasks:'<path d="M4 6h3l2 2 4-4M15 6h5M4 15h3l2 2 4-4M15 15h5"/>',make:'<rect x="4" y="4" width="13" height="16" rx="3"/><path d="m13 16 6-6 2 2-6 6-3 1z"/>',mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21m-4 0h8"/>',wave:'<path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/>',chev:'<path d="m9 5 7 7-7 7"/>',back:'<path d="m15 5-7 7 7 7"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',paperclip:'<path d="M8 12.5 15.5 5a3 3 0 0 1 4.2 4.2L9.5 19.4a5 5 0 0 1-7-7L13 2"/>',ellipsis:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',file:'<path d="M6 3h8l5 5v13H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v6h5M8 14h8m-8 4h6"/>'};
function icon(k,n=20){return `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[k]}</svg>`}
function logo(small=false){return `<svg ${small?'class="small-logo"':''} viewBox="0 0 44 44" fill="none"><path d="M5 24.5C12 21 17 21 22 25c5 4 10 4 17-1.5" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M16 19.5c1.5-5 4.8-7.5 8.2-7.5 5.5 0 9.1 6 10.2 13.2" stroke="#d26c4e" stroke-width="6.5" stroke-linecap="round"/></svg>`}
function status(){return `<div class="status"><span>9:41</span><div class="status-right"><div class="signal"><i></i><i></i><i></i><i></i></div><span class="wifi">◕</span><span class="battery"><b></b></span></div></div>`}
function bar(){return `<div class="appbar"><div class="circle-icon">${icon('menu',18)}</div><div class="brand">${logo()}</div><div class="circle-icon avatar">M</div></div>`}
function nav(active){return `<div class="nav">${[['Chat','message'],['Tasks','tasks'],['Make','make']].map(([name,ic])=>`<div class="nav-item ${name===active?'active':''}">${icon(ic)}<span>${name}</span></div>`).join('')}</div>`}
function bottom(active='Chat'){return `<div class="bottom-area"><div class="composer"><span class="iconwrap">${icon('plus',19)}</span><span class="placeholder">Message Mika</span><span>${icon('mic',18)}</span><div class="voice">${icon('wave',19)}</div></div>${nav(active)}</div>`}
function phone(content){return `<div class="phone"><div class="screen">${status()}${content}<div class="gesture"></div></div></div>`}
function home(){return phone(`${bar()}<div class="page-inner"><div class="hero"><h1>Good <span class="serif">afternoon.</span></h1><p>A little ahead of your day, with Mika.</p></div><div class="section-label">For you today <span class="right-link">See all ${icon('chev',11)}</span></div><div class="brief-card"><div class="brief-meta"><span class="dot"></span><span class="ready">Ready for review</span> · Morning brief</div><div class="brief-title">Three updates worth<br>your attention.</div><div class="mini-stats"><div class="mini-stat"><small>Projects</small><strong>2 updates</strong></div><div class="mini-stat"><small>Needs you</small><strong>1 decision</strong></div></div></div><div class="chat-note"><div class="note-avatar">${logo(true)}</div><div class="chat-bubble">I pulled together your recent project notes. Want the short version?</div></div><div class="note-actions"><div class="chip accent">Summarize</div><div class="chip">Review tasks</div></div></div>${bottom()}`)}
function tasks(){return phone(`${bar()}<div class="page-inner"><h1 class="tasks-title">Your work<span style="color:var(--coral)">.</span></h1><div class="tasks-sub">A quieter view of everything in motion.</div><div class="tabs"><div class="tab active">Active</div><div class="tab">Up next</div><div class="tabs-right">${icon('search',17)}</div></div><div class="task-group"><div class="task-label">Ready for review · 1</div><div class="task-item"><span class="task-checkbox"></span><div class="task-copy"><strong>Mika interface proposal</strong><p><span class="green">Ready for review</span> · 6 screens prepared</p></div><span class="tiny-chevron">${icon('chev',15)}</span></div></div><div class="task-group working"><div class="task-label">Working · 1</div><div class="task-item"><span class="task-checkbox"></span><div class="task-copy"><strong>Research agent libraries</strong><p><span class="warm">In progress</span> · Checking Android options</p><div class="progress"></div></div><span class="tiny-chevron">${icon('chev',15)}</span></div></div><div class="task-group scheduled"><div class="task-label">Scheduled · 1</div><div class="task-item"><span class="task-checkbox"></span><div class="task-copy"><strong>Morning updates</strong><p>Tomorrow · 8:00 AM</p></div><span class="tiny-chevron">${icon('chev',15)}</span></div></div><div class="task-group resolved"><div class="task-label">Resolved · 2 <span>${icon('chev',13)}</span></div></div></div><div class="fab">${icon('plus',22)}</div><div class="task-bottom">${nav('Tasks')}</div>`)}
function review(){return phone(`<div class="focus-header"><div class="circle-icon">${icon('back',18)}</div><div class="focus-pill"><div>${icon('file',18)}</div><div><b>Project recap</b><small>Needs your approval</small></div></div><div class="circle-icon">${icon('ellipsis',18)}</div></div><div class="focus-chat"><div class="bubble-row user"><div class="bubble">Prepare a short update for the team.</div></div><div class="bubble-row assistant"><div class="bubble">Done. I drafted the recap and left it for you to review.</div></div><div class="review-card"><div class="review-head"><div class="review-icon">${icon('mail',16)}</div><b>Email draft</b><span>Not sent</span></div><div class="review-body"><div class="review-data">To: <strong>Project team</strong></div><div class="review-data">Subject: <strong>Mika project update</strong></div><p class="review-message">Hi everyone,\n\nHere's a short recap of our progress this week, along with the next steps and open questions.\n\nThanks!</p><div class="file-chip">${icon('file',15)}<b>Project notes.pdf</b><small>2.4 MB</small></div></div><div class="review-actions"><div class="review-button">Not now</div><div class="review-button primary">Approve</div></div></div><div class="activity-strip"><span class="dot"></span><b>2 actions prepared</b><span>· Nothing sent yet</span></div></div>${bottom()}`)}
function makeBoard(theme,subtitle){return `<section class="board ${theme}" id="${theme}"><div class="board-header"><div><div class="header-kicker">MIKA / INTERFACE STUDY 01</div><h1 class="board-title">A more thoughtful kind of agent.</h1><p class="board-sub">${subtitle}</p></div><div class="header-right">ANDROID CONCEPT<br>${theme==='dark'?'AMOLED EDITION':'WARM LIGHT EDITION'}<br>2026 · 01 / 02</div></div><div class="stage"><div class="phone-cell">${home()}<div class="screen-label">01 &nbsp; Conversation <small>Home + brief</small></div></div><div class="phone-cell">${tasks()}<div class="screen-label">02 &nbsp; Tasks <small>Active work</small></div></div><div class="phone-cell">${review()}<div class="screen-label">03 &nbsp; Review <small>Human approval</small></div></div></div><div class="footer">Concept exploration · Native Android / Material 3 Expressive</div></section>`}
document.getElementById('root').innerHTML=makeBoard('light','An editorial, Duet-inspired experience built around Mika’s own capabilities.')+makeBoard('dark','The same restrained layout, tuned for deep blacks and OLED screens.');
</script></body></html>
