name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  find-pr:
    if: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    outputs:
      open: ${{ steps.check.outputs.open }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if number=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open -f "head=${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" \
            -f per_page=1 --jq '.[0].number // 0'); then
            if [ "$number" = 0 ]; then
              echo 'open=false' >> "$GITHUB_OUTPUT"
            elif mergeable=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '.mergeable'); then
              # A conflicted or not-yet-computed PR may not start a PR workflow.
              if [ "$mergeable" = true ]; then
                echo 'open=true' >> "$GITHUB_OUTPUT"
              else
                echo 'open=false' >> "$GITHUB_OUTPUT"
              fi
            else
              echo '::warning::Could not check PR mergeability; running CI.'
              echo 'open=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo '::warning::Could not check for an open pull request; running CI.'
            echo 'open=false' >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: find-pr
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.find-pr.outputs.open != 'true') }}
    uses: ./.github/workflows/ci.yml
