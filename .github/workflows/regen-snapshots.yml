name: Regenerate prompt snapshots (temporary)

on:
  push:
    branches: [claude/project-thread-nmao1i]

permissions:
  contents: write

jobs:
  regen:
    if: ${{ contains(github.event.head_commit.message, '[regen-snapshots]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Regenerate snapshots
        env:
          UPDATE_GOLDEN: "1"
        run: ./gradlew :core:test -PupdateSnapshots --continue || true
      - name: Commit regenerated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/test/resources
          if git diff --cached --quiet; then echo "No snapshot changes"; else
            git commit -m "Regenerate prompt snapshots after English translation"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Core tests after regeneration
        run: ./gradlew :core:test --continue
