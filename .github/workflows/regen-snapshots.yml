name: Regenerate prompt snapshots (temporary)

on:
  push:
    branches: [claude/project-thread-ererpf]

permissions:
  contents: write

jobs:
  regen:
    if: ${{ contains(github.event.head_commit.message, '[regen-snapshots]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358"
      - uses: actions/setup-go@v6
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Regenerate snapshots
        env:
          UPDATE_GOLDEN: "1"
        run: ./gradlew :core:test -PupdateSnapshots --continue -q > /dev/null 2>&1 || true
      - name: Print remaining test failures
        run: |
          for f in $(grep -l "<failure" core/build/test-results/test/*.xml 2>/dev/null); do
            echo "=== $f"; sed -n '/<failure/,/<\/failure>/p' "$f" | head -25
          done
      - name: Commit regenerated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/test/resources
          if git diff --cached --quiet; then echo "No snapshot changes"; else
            git commit -m "Regenerate prompt snapshots"
            git push origin HEAD:${{ github.ref_name }}
          fi
