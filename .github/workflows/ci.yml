name: CI

# 只做 CI：单元测试、Android 打包、CLI 契约和网关集成。发布（CD）仍是手工流程。
on:
  workflow_dispatch:
    inputs:
      capture_screenshots:
        description: Capture light and dark Android screens on a clean emulator
        type: boolean
        default: false
  workflow_call:
    inputs:
      capture_screenshots:
        type: boolean
        default: false

permissions:
  contents: read

# 同一个 PR 推新提交时取消上一次还没跑完的，main 上的推送各自跑完。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # 默认缓存策略：默认分支可写，其他分支（含 PR）只读。
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Unit tests
        run: ./gradlew :core:test --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-results
          path: |
            core/build/test-results/test
            core/build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore

  cli:
    name: cli (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # cliTest 先跑 cliContractTest（经真实子进程调 Python CLI），再跑 tools/mika/tests 下的 unittest。
      - name: CLI tests
        run: ./gradlew :core:cliTest -PmikaPython=python3 --stacktrace
      - name: Translation tool tests
        run: python3 -m unittest discover -s tools/i18n -v
      - name: Translation resource checks
        run: python3 tools/i18n/translations.py check
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cli-test-results
          path: |
            core/build/test-results/cliContractTest
            core/build/reports/tests/cliContractTest
          retention-days: 7
          if-no-files-found: ignore

  app:
    name: app (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # compileSdk 36；构建工具版本取 AGP 8.7.3 的默认值。action 顺带接受 SDK 许可。
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0 ndk;27.2.12479018"
      # The WhatsApp linked-device library (whatsapp-bridge/) is Go, built into an .aar during the Gradle build.
      - uses: actions/setup-go@v6
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # assembleDebug 验证单测碰不到的打包路径：31MB 的 rootfs、jniLibs 旧式解压、AIDL、Compose。
      # 编译设备测试以检查设置交互等回归用例；这里没有连接设备，不执行 instrumentation。
      - name: Unit tests, debug build, and device test compilation
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:compileDebugAndroidTestKotlin --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Mika-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Start Android emulator for visual capture
        id: visual_emulator
        if: ${{ inputs.capture_screenshots }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          android_cli="$ANDROID_HOME/cmdline-tools/latest/bin/android"
          "$android_cli" --sdk="$ANDROID_HOME" emulator create medium_phone
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx medium_phone
          "$ANDROID_HOME/emulator/emulator" -avd medium_phone -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > /tmp/mika-emulator.log 2>&1 &
          timeout 240 adb wait-for-device || { cat /tmp/mika-emulator.log; exit 1; }
          timeout 240 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done' || { cat /tmp/mika-emulator.log; exit 1; }
      - name: Run focused Android interaction tests
        if: ${{ inputs.capture_screenshots }}
        run: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.wangzan101.mika.ui.TaskTabsTest,com.wangzan101.mika.ui.EditorialHeaderTest,com.wangzan101.mika.ui.ChatRecommendationTest,com.wangzan101.mika.ui.ChatSearchTest,com.wangzan101.mika.ui.OrbitHubButtonTest,com.wangzan101.mika.ui.ChatAttachmentsTest --stacktrace
      - name: Capture actual Android screens
        if: ${{ !cancelled() && inputs.capture_screenshots && steps.visual_emulator.outcome == 'success' }}
        run: python3 tools/ui/capture_screens.py app/build/outputs/apk/debug/app-debug.apk build/visual-captures
      - name: Upload Android screenshots
        if: ${{ !cancelled() && inputs.capture_screenshots }}
        uses: actions/upload-artifact@v7
        with:
          name: Mika-screenshots-${{ github.sha }}
          path: build/visual-captures/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-test-results
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
            app/build/outputs/androidTest-results/connected
            app/build/reports/androidTests/connected
          retention-days: 7
          if-no-files-found: ignore

  relay:
    name: relay (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/relay/go.mod
          cache: true
          cache-dependency-path: tools/relay/go.sum
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # relayTest 会先 go build 出真实网关，再在回环上跑 Kotlin→网关→隧道全链路。
      - name: Relay integration test
        run: ./gradlew :core:relayTest --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relay-test-results
          path: |
            core/build/test-results/relayTest
            core/build/reports/tests/relayTest
          retention-days: 7
          if-no-files-found: ignore
